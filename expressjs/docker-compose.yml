services:
  postgres:
    image: postgres:18-alpine
    container_name: aws-expressjs-template-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: express_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d express_db"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
