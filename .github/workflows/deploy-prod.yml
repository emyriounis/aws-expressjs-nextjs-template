name: CI/CD Pipeline

on:
  push:
    branches: ['main']

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  test-expressjs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: expressjs/package-lock.json
      - run: |
          cd expressjs
          npm ci
          npm run test

  test-reactjs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: reactjs/package-lock.json
      - run: |
          cd reactjs
          npm ci
          npm run test

  test-terraform:
    container:
      image: aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e # v0.70
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Run Trivy IaC Scanner
        run: trivy config terraform --severity CRITICAL --exit-code 1

  build-expressjs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: expressjs/package-lock.json
      - name: Install Zip
        run: sudo apt-get update && sudo apt-get install -y zip
      - run: |
          cd expressjs
          npm ci
          npm run prepare-lambda
      - uses: actions/upload-artifact@v6
        with:
          name: expressjs-artifacts
          path: |
            expressjs/layer.zip
            expressjs/source.zip

  build-reactjs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: reactjs/package-lock.json
      - run: |
          cd reactjs
          npm ci
          CI=false npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: reactjs-artifacts
          path: reactjs/build

  deploy-dev:
    needs:
      - test-expressjs
      - test-reactjs
      - test-terraform
      - build-expressjs
      - build-reactjs
    runs-on: ubuntu-24.04
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.11.1

      - name: Download Artifacts - expressjs
        uses: actions/download-artifact@v7
        with:
          name: expressjs-artifacts
          path: expressjs

      - name: Download Artifacts - reactjs
        uses: actions/download-artifact@v7
        with:
          name: reactjs-artifacts
          path: reactjs/build

      - name: Deploy
        env:
          TF_WORKSPACE: dev
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve -var-file=config/dev.tfvars
